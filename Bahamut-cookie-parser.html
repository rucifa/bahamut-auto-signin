<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>巴哈 Cookie 解析器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="light"] {
    --color-bg: #f7f6f2; --color-surface: #f9f8f5; --color-surface-2: #fbfbf9;
    --color-surface-offset: #f0ede8; --color-divider: #dcd9d5; --color-border: #d4d1ca;
    --color-text: #28251d; --color-text-muted: #7a7974; --color-text-faint: #bab9b4;
    --color-primary: #01696f; --color-primary-hover: #0c4e54;
    --color-success: #437a22; --color-success-highlight: #d4dfcc;
    --color-warning: #964219; --color-warning-highlight: #ddcfc6;
    --color-error: #a12c7b; --color-error-highlight: #e0ced7;
    --color-blue: #006494;
    --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem;
    --radius-xl: 1rem; --radius-full: 9999px;
    --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
    --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    --font-body: 'Noto Sans TC', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  [data-theme="dark"] {
    --color-bg: #171614; --color-surface: #1c1b19; --color-surface-2: #201f1d;
    --color-surface-offset: #252422; --color-divider: #262523; --color-border: #393836;
    --color-text: #cdccca; --color-text-muted: #797876; --color-text-faint: #5a5957;
    --color-primary: #4f98a3; --color-primary-hover: #227f8b;
    --color-success: #6daa45; --color-success-highlight: #3a4435;
    --color-warning: #bb653b; --color-warning-highlight: #564942;
    --color-error: #d163a7; --color-error-highlight: #4c3d46;
    --color-blue: #5591c7;
    --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.2);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --color-bg: #171614; --color-surface: #1c1b19; --color-surface-2: #201f1d;
      --color-surface-offset: #252422; --color-divider: #262523; --color-border: #393836;
      --color-text: #cdccca; --color-text-muted: #797876; --color-text-faint: #5a5957;
      --color-primary: #4f98a3; --color-primary-hover: #227f8b;
      --color-success: #6daa45; --color-success-highlight: #3a4435;
      --color-warning: #bb653b; --color-warning-highlight: #564942;
      --color-error: #d163a7; --color-error-highlight: #4c3d46;
      --color-blue: #5591c7; --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
  body { min-height: 100dvh; font-family: var(--font-body); font-size: 1rem; color: var(--color-text); background: var(--color-bg); padding: 1.5rem 1rem; }
  .container { max-width: 720px; margin-inline: auto; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
  .logo { display: flex; align-items: center; gap: 0.625rem; font-size: 1.125rem; font-weight: 700; color: var(--color-text); }
  .logo svg { color: var(--color-primary); }
  .theme-btn { width: 36px; height: 36px; border-radius: var(--radius-full); border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text-muted); cursor: pointer; display: grid; place-items: center; transition: background var(--transition), color var(--transition); }
  .theme-btn:hover { background: var(--color-surface-offset); color: var(--color-text); }

  .input-section { margin-bottom: 1.5rem; }
  label { display: block; font-size: 0.875rem; font-weight: 500; color: var(--color-text-muted); margin-bottom: 0.5rem; letter-spacing: 0.02em; text-transform: uppercase; }
  textarea { width: 100%; min-height: 100px; padding: 0.75rem 1rem; border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-surface); color: var(--color-text); font-family: var(--font-mono); font-size: 0.8125rem; line-height: 1.6; resize: vertical; transition: border-color var(--transition), box-shadow var(--transition); outline: none; }
  textarea:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px oklch(from var(--color-primary) l c h / 0.15); }
  textarea::placeholder { color: var(--color-text-faint); }

  .btn-row { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
  .btn { padding: 0.5rem 1.25rem; border-radius: var(--radius-md); font-size: 0.875rem; font-weight: 500; cursor: pointer; border: none; transition: background var(--transition), transform var(--transition); }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--color-primary); color: #fff; }
  .btn-primary:hover { background: var(--color-primary-hover); }
  .btn-ghost { background: transparent; color: var(--color-text-muted); border: 1px solid var(--color-border); }
  .btn-ghost:hover { background: var(--color-surface-offset); color: var(--color-text); }

  .notice { display: flex; align-items: flex-start; gap: 0.625rem; padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.875rem; color: var(--color-text-muted); background: var(--color-surface-offset); border: 1px solid var(--color-border); margin-bottom: 1.5rem; line-height: 1.6; }
  .notice svg { flex-shrink: 0; margin-top: 2px; color: var(--color-blue); }
  .notice code { font-family: var(--font-mono); background: var(--color-surface); padding: 0 4px; border-radius: 3px; font-size: 0.8125rem; }

  #results { display: none; }
  #results.show { display: block; }

  .section-title { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-faint); margin-bottom: 0.75rem; }

  .expiry-banner { display: flex; align-items: center; gap: 0.75rem; padding: 0.875rem 1rem; border-radius: var(--radius-lg); margin-bottom: 1.5rem; font-size: 0.9375rem; font-weight: 500; }
  .expiry-banner.ok { background: var(--color-success-highlight); color: var(--color-success); }
  .expiry-banner.warn { background: var(--color-warning-highlight); color: var(--color-warning); }
  .expiry-banner.expired { background: var(--color-error-highlight); color: var(--color-error); }
  .expiry-detail { font-size: 0.8125rem; font-weight: 400; opacity: 0.8; margin-top: 0.125rem; }

  .secret-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 0.875rem 1rem; box-shadow: var(--shadow-sm); margin-bottom: 1.5rem; }
  .secret-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; }
  .secret-name { font-family: var(--font-mono); font-size: 0.8125rem; font-weight: 500; color: var(--color-primary); background: oklch(from var(--color-primary) l c h / 0.1); padding: 0.125rem 0.5rem; border-radius: var(--radius-sm); }
  .copy-btn { display: flex; align-items: center; gap: 0.375rem; font-size: 0.8125rem; font-weight: 500; color: var(--color-text-muted); background: var(--color-surface-offset); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 0.25rem 0.625rem; cursor: pointer; transition: all var(--transition); }
  .copy-btn:hover { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
  .copy-btn.copied { background: var(--color-success); color: #fff; border-color: var(--color-success); }
  .secret-value { font-family: var(--font-mono); font-size: 0.75rem; color: var(--color-text-muted); word-break: break-all; line-height: 1.6; background: var(--color-surface-2); border: 1px solid var(--color-divider); border-radius: var(--radius-sm); padding: 0.625rem 0.75rem; user-select: all; max-height: 120px; overflow-y: auto; }
  .secret-desc { font-size: 0.75rem; color: var(--color-text-faint); margin-top: 0.375rem; }

  .missing-list { display: flex; flex-direction: column; gap: 0.375rem; margin-bottom: 1.5rem; }
  .missing-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; border-radius: var(--radius-md); background: var(--color-error-highlight); font-size: 0.875rem; color: var(--color-error); }
  .missing-item code { font-family: var(--font-mono); font-size: 0.8125rem; font-weight: 500; }

  .divider { height: 1px; background: var(--color-divider); margin: 1.5rem 0; }

  .tokens-table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
  .tokens-table th { background: var(--color-surface-offset); color: var(--color-text-muted); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.5rem 0.875rem; text-align: left; border-bottom: 1px solid var(--color-border); }
  .tokens-table td { padding: 0.5rem 0.875rem; border-bottom: 1px solid var(--color-divider); vertical-align: top; }
  .tokens-table tr:last-child td { border-bottom: none; }
  .tokens-table .key-cell { font-family: var(--font-mono); font-size: 0.75rem; color: var(--color-primary); white-space: nowrap; width: 1%; }
  .tokens-table .val-cell { font-family: var(--font-mono); font-size: 0.75rem; color: var(--color-text-muted); word-break: break-all; max-width: 300px; }
  .tokens-table .mini-copy { background: none; border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 0.125rem 0.375rem; font-size: 0.6875rem; color: var(--color-text-faint); cursor: pointer; white-space: nowrap; transition: all var(--transition); }
  .tokens-table .mini-copy:hover { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
  .tokens-table .mini-copy.copied { background: var(--color-success); color: #fff; border-color: var(--color-success); }
  .empty-row td { text-align: center; color: var(--color-text-faint); padding: 1.5rem; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">
      <svg aria-label="巴哈 Cookie 解析器" width="28" height="28" viewBox="0 0 28 28" fill="none">
        <rect x="2" y="2" width="24" height="24" rx="6" stroke="currentColor" stroke-width="2"/>
        <path d="M8 10h12M8 14h8M8 18h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="22" cy="18" r="4" fill="currentColor" opacity="0.15"/>
        <circle cx="22" cy="18" r="2" fill="currentColor"/>
      </svg>
      巴哈 Cookie 解析器
    </div>
    <button class="theme-btn" data-theme-toggle aria-label="切換深色模式">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <div class="notice">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
    </svg>
    <span>此工具完全在瀏覽器本地執行，Cookie 不會傳送至任何伺服器。<br>
    請從瀏覽器 F12 → Application → Cookies → <code>gamer.com.tw</code>，複製所有 Cookie 後貼入下方。</span>
  </div>

  <div class="input-section">
    <label for="cookie-input">貼入完整 Cookie 字串</label>
    <textarea id="cookie-input" placeholder="uid=xxx; cookie_login_new=xxx; BAHARUNE=eyJhbGci...; ckBahamutCsrfToken=xxx; ..."></textarea>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="parseCookie()">解析</button>
      <button class="btn btn-ghost" onclick="clearAll()">清除</button>
    </div>
  </div>

  <div id="results">
    <div id="expiry-banner" class="expiry-banner ok"></div>

    <p class="section-title">GitHub Secret 設定值</p>
    <div class="secret-card">
      <div class="secret-header">
        <span class="secret-name">BAHAMUT_COOKIE</span>
        <button class="copy-btn" id="copy-full-btn" onclick="copyFull()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          複製完整 Cookie
        </button>
      </div>
      <div class="secret-value" id="full-cookie-display"></div>
      <p class="secret-desc">將此值完整貼入 GitHub → Settings → Secrets → BAHAMUT_COOKIE</p>
    </div>

    <div id="missing-section" style="display:none;">
      <p class="section-title">⚠️ 未找到的重要鍵值</p>
      <div class="missing-list" id="missing-list"></div>
    </div>

    <div class="divider"></div>

    <p class="section-title">所有 Cookie 鍵值一覽</p>
    <table class="tokens-table">
      <thead>
        <tr><th>Key</th><th>Value</th><th></th></tr>
      </thead>
      <tbody id="tokens-tbody"></tbody>
    </table>
  </div>
</div>

<script>
(function(){
  const t = document.querySelector('[data-theme-toggle]');
  const r = document.documentElement;
  let d = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
  r.setAttribute('data-theme', d);
  if (t) t.addEventListener('click', () => {
    d = d === 'dark' ? 'light' : 'dark';
    r.setAttribute('data-theme', d);
    t.innerHTML = d === 'dark'
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  });
})();

let fullCookieValue = '';

function parseCookie() {
  const raw = document.getElementById('cookie-input').value.trim();
  if (!raw) return;
  fullCookieValue = raw;

  const tokens = {};
  raw.split(';').forEach(part => {
    const idx = part.indexOf('=');
    if (idx === -1) return;
    const k = part.slice(0, idx).trim();
    const v = part.slice(idx + 1).trim();
    if (k) tokens[k] = v;
  });

  // Parse JWT expiry
  let expDate = '未知', daysLeft = null;
  const jwt = tokens['BAHARUNE'] || '';
  if (jwt) {
    try {
      const parts = jwt.split('.');
      if (parts.length >= 2) {
        let b64 = parts[1].replace(/-/g,'+').replace(/_/g,'/');
        while (b64.length % 4) b64 += '=';
        const payload = JSON.parse(atob(b64));
        if (payload.exp) {
          const expMs = payload.exp * 1000;
          daysLeft = Math.floor((expMs - Date.now()) / 86400000);
          expDate = new Date(expMs).toLocaleDateString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit'});
        }
      }
    } catch(e) {}
  }

  // Expiry banner
  const banner = document.getElementById('expiry-banner');
  let cls, icon, msg;
  if (daysLeft === null) {
    cls='ok'; icon='📋'; msg=`Cookie 解析完成<div class="expiry-detail">未找到 BAHARUNE Token，無法判斷到期時間</div>`;
  } else if (daysLeft < 0) {
    cls='expired'; icon='❌'; msg=`Cookie 已過期（${expDate}）<div class="expiry-detail">請立即重新從瀏覽器取得 Cookie！</div>`;
  } else if (daysLeft <= 7) {
    cls='warn'; icon='⚠️'; msg=`Cookie 將於 ${expDate} 到期（剩餘 ${daysLeft} 天）<div class="expiry-detail">請盡快更新 GitHub Secret！</div>`;
  } else {
    cls='ok'; icon='✅'; msg=`Cookie 有效，到期日 ${expDate}（剩餘 ${daysLeft} 天）<div class="expiry-detail">目前狀態正常</div>`;
  }
  banner.className = `expiry-banner ${cls}`;
  banner.innerHTML = `<span style="font-size:1.25rem">${icon}</span><div>${msg}</div>`;

  // Full cookie display
  document.getElementById('full-cookie-display').textContent = raw;

  // Missing keys check
  const important = ['BAHARUNE','ckBahamutCsrfToken','uid','cookie_login_new'];
  const missing = important.filter(k => !tokens[k]);
  const missingSec = document.getElementById('missing-section');
  if (missing.length > 0) {
    missingSec.style.display = 'block';
    document.getElementById('missing-list').innerHTML = missing.map(k =>
      `<div class="missing-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><code>${k}</code> 未找到，Cookie 可能不完整</div>`
    ).join('');
  } else {
    missingSec.style.display = 'none';
  }

  // All tokens table
  const tbody = document.getElementById('tokens-tbody');
  tbody.innerHTML = '';
  const keys = Object.keys(tokens);
  if (keys.length === 0) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="3">未解析到任何 Cookie 鍵值</td></tr>';
  } else {
    keys.forEach(k => {
      const v = tokens[k];
      const shortV = v.length > 60 ? v.substring(0, 60) + '…' : v;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="key-cell">${escHtml(k)}</td>
        <td class="val-cell" title="${escHtml(v)}">${escHtml(shortV)}</td>
        <td><button class="mini-copy" onclick="copyText(this, ${JSON.stringify(v)})">複製</button></td>`;
      tbody.appendChild(tr);
    });
  }

  document.getElementById('results').classList.add('show');
  document.getElementById('results').scrollIntoView({behavior:'smooth', block:'start'});
}

function copyFull() {
  const btn = document.getElementById('copy-full-btn');
  navigator.clipboard.writeText(fullCookieValue).then(() => {
    const orig = btn.innerHTML;
    btn.classList.add('copied');
    btn.textContent = '已複製！';
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 1800);
  });
}

function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.innerHTML;
    btn.classList.add('copied');
    btn.textContent = '已複製！';
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 1800);
  });
}

function clearAll() {
  document.getElementById('cookie-input').value = '';
  document.getElementById('results').classList.remove('show');
  fullCookieValue = '';
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
